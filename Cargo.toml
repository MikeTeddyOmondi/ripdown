[workspace]
members = ["crates/ripdown-core", "crates/ripdown-cli", "crates/ripdown-http"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Rancko"]
license = "MIT"
description = "A blazing-fast video downloader for YouTube"
repository = "https://github.com/locci/ripdown"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Error handling
anyhow = "1"
thiserror = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Domain helpers
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6.0.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Download engine
yt-dlp = { version = "2.8.3", features = ["hooks"] }

# Internal
ripdown-core = { path = "crates/ripdown-core" }

[profile.release]
opt-level = 3
strip = true
lto = true
