[package]
name = "ripdown"
version = "0.1.0"
edition = "2021"
description = "A blazing-fast terminal video downloader for YouTube, X, Instagram, and 1800+ sites"
authors = ["Rancko"]

[[bin]]
name = "ripdown"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color", "env"] }
tokio = { version = "1", features = ["full"] }
ratatui = "0.30.0"
crossterm = "0.29"
yt-dlp = { version = "2.7.1", features = ["hooks"] }
indicatif = { version = "0.18.4", features = ["tokio"] }
dirs = "6.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1"

[profile.release]
opt-level = 3
strip = true
lto = true
